# TinyStories, single PIC (see tinystories/ROADMAP.md): a PIC16F876 at
# 20 MHz reads the weights from three 25LC1024 SPI EEPROMs, keeps the KV
# cache in a 23LC1024 SPI SRAM and writes the story on an ST7920 LCD.
#
# The EEPROMs hold the weight image from tinystories/export.py, 128K per
# chip; make it with `cd tinystories && python3 export.py`.
#
# The firmware, tinystories.asm, writes stories with the model; it needs
# data.inc from gen_data.py. eeprom_test.asm is the bring-up test for the
# three EEPROMs.
name = "TinyStories"

[parts]
U1 = { model = "PIC16F876", rom = "tinystories.hex", fosc = "20MHz" }
U2 = { model = "25LC1024", image = "../../tinystories/out/weights_n1_k0.bin" }
U3 = { model = "25LC1024", image = "../../tinystories/out/weights_n1_k0.bin", offset = "128K" }
U4 = { model = "25LC1024", image = "../../tinystories/out/weights_n1_k0.bin", offset = "256K" }
U5 = { model = "23LC1024" }
J1 = { model = "ST7920", scale = 4 }

[nets]
# SPI on the MSSP pins; one chip select each.
SPI_SCK = ["U1.RC3", "U2.SCK", "U3.SCK", "U4.SCK", "U5.SCK"]
SPI_MISO = ["U1.RC4", "U2.SO", "U3.SO", "U4.SO", "U5.SO"]
SPI_MOSI = ["U1.RC5", "U2.SI", "U3.SI", "U4.SI", "U5.SI"]
EE0_CS = ["U1.RC0", "U2.CS"]
EE1_CS = ["U1.RC1", "U3.CS"]
EE2_CS = ["U1.RA5", "U4.CS"]
RAM_CS = ["U1.RC2", "U5.CS"]
"+5V" = ["U2.HOLD", "U2.WP", "U3.HOLD", "U3.WP", "U4.HOLD", "U4.WP", "U5.HOLD", "J1.PSB", "J1.RST"]

# LCD in 4-bit parallel mode: DB4..DB7 on RB4..RB7, DB0..DB3 tied low.
# RB3 stays free for low-voltage programming (PGM; 10k to GND on the
# real board).
LCD_RS = ["U1.RA0", "J1.RS"]
LCD_RW = ["U1.RA1", "J1.RW"]
LCD_E = ["U1.RA2", "J1.E"]
"LCD_DB4..7" = ["U1.RB4..7", "J1.DB4..7"]
GND = ["J1.DB0", "J1.DB1", "J1.DB2", "J1.DB3"]
